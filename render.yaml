services:
  # Danodia FreightOS Backend API Web Service
  - type: web
    name: danodia-freightos-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: danodia-freightos-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://danodia-freightos.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: DB_POOL_MAX
        value: "10"

databases:
  # Production Managed PostgreSQL Database
  - name: danodia-freightos-db
    databaseName: shipment_manager
    user: freightos_user
    plan: starter
    postgresMajorVersion: 16
